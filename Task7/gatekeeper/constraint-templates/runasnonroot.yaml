apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredcontainersecurity
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredContainerSecurity
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredcontainersecurity

        container[c] {
          c := input.review.object.spec.containers[_]
        }

        container[c] {
          c := input.review.object.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          c := container[_]
          not c.securityContext.runAsNonRoot == true
          msg := sprintf("container %q must set securityContext.runAsNonRoot: true", [c.name])
        }

        violation[{"msg": msg}] {
          c := container[_]
          not c.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("container %q must set securityContext.readOnlyRootFilesystem: true", [c.name])
        }
